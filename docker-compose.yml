services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: argplant
      POSTGRES_PASSWORD: argplant
      POSTGRES_DB: argplant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U argplant"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api: &api
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data

  worker:
    <<: *api
    ports: []
    command: arq argplant.modules.ingestion.worker.WorkerSettings

volumes:
  pgdata:
